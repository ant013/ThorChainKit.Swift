appId: org.horizontalsystems.thorchainkit.example.fixture
name: send-unknown
---
- launchApp:
    clearState: true
    arguments:
      "--example-scenario": "send-unknown"
- tapOn:
    id: lifecycle-open
- tapOn:
    id: lifecycle-start
- extendedWaitUntil:
    visible: "synced"
    timeout: 10000
- tapOn:
    id: BackButton
- tapOn:
    id: send-open
- tapOn:
    id: send.amount.input
- inputText: "1"
- tapOn:
    id: send.quote.button
- tapOn:
    id: send.confirm.button
- assertVisible:
    id: send.result.local-hash
- assertVisible:
    id: send.retry.button
- assertVisible:
    text: "Unknown — retry available"
