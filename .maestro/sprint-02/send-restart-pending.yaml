appId: org.horizontalsystems.thorchainkit.example.fixture
name: send-restart-pending
---
- launchApp:
    clearState: true
    arguments:
      "--example-scenario": "send-restart-pending"
- tapOn:
    id: lifecycle-open
- tapOn:
    id: lifecycle-start
- extendedWaitUntil:
    visible: "synced"
    timeout: 10000
- tapOn:
    id: BackButton
- tapOn:
    id: send-open
- tapOn:
    id: send.amount.input
- inputText: "1"
- tapOn:
    id: send.quote.button
- tapOn:
    id: send.confirm.button
- assertVisible:
    id: send.pending.list
- launchApp
- assertVisible:
    text: "thor-example/fixture/send-restart-pending"
- assertVisible:
    id: send.pending.namespace
- assertVisible:
    id: send.pending.list
