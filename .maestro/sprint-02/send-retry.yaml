appId: org.horizontalsystems.thorchainkit.example.fixture
name: send-retry
---
- launchApp:
    clearState: true
    arguments:
      "--example-scenario": "send-retry"
- tapOn:
    id: send-open
- tapOn:
    id: send.amount.input
- inputText: "1"
- tapOn:
    id: send.quote.button
- tapOn:
    id: send.confirm.button
- assertVisible:
    id: send.retry.previous-fee
- assertVisible:
    id: send.retry.current-fee
- assertVisible:
    id: send.retry.response
    text: "sdk/19"
- assertVisible:
    id: send.fixture.signer-call-count
    text: "1"
- tapOn:
    id: send.retry.button
- assertVisible:
    id: send.retry.hash-unchanged
    text: "true"
- assertVisible:
    id: send.retry.signer-count-unchanged
    text: "true"
- assertVisible:
    id: send.fixture.signer-call-count
    text: "1"
- assertVisible:
    id: send.result.local-hash
