appId: org.horizontalsystems.thorchainkit.example.fixture
name: send-quote-review
---
- launchApp:
    clearState: true
    arguments:
      "--example-scenario": "send-quote-review"
- tapOn:
    id: lifecycle-open
- tapOn:
    id: lifecycle-start
- extendedWaitUntil:
    visible: "synced"
    timeout: 10000
- tapOn:
    id: BackButton
- tapOn:
    id: send-open
- tapOn:
    id: send.amount.input
- inputText: "1.25"
- tapOn:
    id: send.memo.input
- inputText: "fixture memo"
- tapOn:
    id: send.quote.button
- assertVisible:
    id: send.review.amount
- assertVisible:
    id: send.review.recipient
- assertVisible:
    id: send.review.memo
- assertVisible:
    id: send.review.native-fee
- assertVisible:
    id: send.review.total
- assertVisible:
    id: send.review.height
- assertVisible:
    id: send.review.expiry
- assertVisible:
    id: send.confirm.button
    enabled: true
- tapOn:
    id: send.fixture.advance-to-expiry
- assertVisible:
    text: "Quote expired — refresh required"
- assertVisible:
    id: send.confirm.button
    enabled: false
- assertVisible:
    id: send.refresh.button
- assertVisible:
    id: send.fixture.signer-call-count
    text: "0"
